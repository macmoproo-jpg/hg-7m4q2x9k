<style>
:root{
  --bg:#0d1017; --surf:#151a23; --surf2:#1c2330; --line:#28313f;
  --hair:rgba(255,255,255,.075);
  --ink:#e9eef7; --dim:#8b97a8; --acc:#ff8a3d; --acc2:#ffb37a;
  --ok:#3ddc84; --warn:#f5c451;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(130% 55% at 50% -8%,rgba(255,138,61,.09),transparent 62%);
  background-repeat:no-repeat;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:var(--acc);text-decoration:none}

/* topbar */
header{position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(13,16,23,.97) 60%,rgba(13,16,23,.80));
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  padding:calc(12px + env(safe-area-inset-top)) 16px 11px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:32px;height:32px;border-radius:10px;flex:none;display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 6px 16px -8px rgba(255,138,61,.55)}
.brand .bt{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:16.5px;letter-spacing:-.02em;font-weight:700;line-height:1.1}
.today-line{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .streak{margin-left:auto;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;
  background:rgba(255,138,61,.09);border:1px solid rgba(255,138,61,.20);border-radius:20px;padding:5px 10px 5px 8px}
.brand .streak b{color:var(--acc);font-size:12.5px;letter-spacing:0;font-weight:700}

/* views */
main{padding:15px 15px 8px;max-width:840px;margin:0 auto}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),var(--surf);
  border:1px solid var(--hair);border-radius:18px;padding:15px;margin-bottom:11px;
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 8px 24px -18px #000}
.card h2{font-size:16.5px;margin-bottom:3px;letter-spacing:-.025em}
.card .meta{font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.4}
.sect{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:22px 0 9px}

/* progress */
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden;margin:11px 0 5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a2a,var(--acc2));border-radius:8px;
  transition:width .45s cubic-bezier(.3,1,.4,1);box-shadow:0 0 12px -2px rgba(255,138,61,.7)}
.bar-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}

/* exercise row */
.ex{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none}
.ex .num{width:20px;flex:none;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:2px}
.ex .body{flex:1;min-width:0}
.ex .name{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.ex .sub{font-size:12px;color:var(--dim);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip{background:var(--surf2);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--dim)}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:10px;border:1.5px solid rgba(255,255,255,.10);background:rgba(255,255,255,.02);
  font-size:11.5px;color:var(--dim);display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:transform .12s,background .18s,border-color .18s}
.dot:active{transform:scale(.92)}
.dot.on{background:linear-gradient(160deg,#4ae08d,#2bbd68);border-color:transparent;color:#04160c;
  font-weight:700;box-shadow:0 4px 12px -5px rgba(61,220,132,.75)}
.yt{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,138,61,.28);background:rgba(255,138,61,.07);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--acc);font-size:11px}
.yt:active{background:var(--surf2)}

/* blocks */
.blk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:none}
.box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;color:transparent}
.box.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.blk .t{font-size:14px}
.blk .d{font-size:11.5px;color:var(--dim)}

/* week */
.wrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:none}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;gap:1px;

nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;
  padding:2px 1px;border-radius:10px;letter-spacing:0;flex:1;min-width:0}
nav button .ic{font-size:15px;line-height:1}

.ringwrap{position:relative;width:252px;height:252px;display:flex;align-items:center;justify-content:center}

.rbg{stroke:var(--line)}
.rfg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.tmid{position:relative;text-align:center;width:190px}

  justify-content:center;line-height:1.2}
.spin{width:100%;background:var(--acc);color:#1a0d03;font-weight:700;border-radius:12px;padding:13px;
  font-size:14px;letter-spacing:-.01em}
.spin:disabled{opacity:.55}
.slotitem{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"n t y" "d t y";gap:1px 8px;

.si-n{grid-area:n;font-size:13.5px;font-weight:600}
.si-d{grid-area:d;font-size:11px;color:var(--dim)}

.why{cursor:pointer;border-style:dashed;border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.015)}

.minbtn{width:100%;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;
  color:var(--dim);margin-bottom:10px;background:transparent}

.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.w7{display:flex;flex-direction:column;align-items:center;gap:0}
.w7b{width:100%;height:92px;background:rgba(255,255,255,.05);border-radius:9px;display:flex;align-items:flex-end;
  overflow:hidden;border:1px solid transparent}
.w7b i{display:block;width:100%;background:rgba(255,255,255,.16);border-radius:8px 8px 0 0;transition:height .4s}
.w7.now .w7b{border-color:rgba(255,138,61,.45);background:rgba(255,138,61,.07)}

.w7p{font-size:9.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}

.w7l{font-size:10px;color:var(--dim);margin-top:2px}
.w7.now .w7l{color:var(--ink);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:4px;height:104px;margin:14px 0 0;
  border-bottom:1px solid var(--hair);padding-bottom:0}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px}
.chart .b{background:rgba(255,255,255,.09);border-radius:4px 4px 0 0;min-height:4px;transition:height .4s}

.chart span{font-size:9px;color:var(--dim);text-align:center;height:13px;white-space:nowrap;

.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:none}
.mlbl{flex:1;font-size:12.5px}
.md{font-size:10.5px;color:var(--dim)}

.reel.rolling{animation:roll .12s linear infinite;color:var(--acc)}
@keyframes roll{0%{transform:translateY(-3px);opacity:.55}50%{transform:translateY(3px);opacity:1}100%{transform:translateY(-3px);opacity:.55}}
.spin{display:flex;align-items:center;justify-content:center;gap:8px}
.lever{display:inline-block;transform:rotate(-12deg);font-size:15px}
.slothead{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.04em;

.startcirc{width:100%;margin:8px 0 4px;border:1px solid var(--ok);color:var(--ok);border-radius:12px;
  padding:12px;font-size:13.5px;font-weight:700;background:rgba(61,220,132,.08)}
.startcirc:active{background:rgba(61,220,132,.16)}
.spark{position:absolute;left:50%;top:46%;width:7px;height:7px;border-radius:50%;pointer-events:none;

@keyframes spark{to{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0}}
.yt.sm{width:26px;height:26px;font-size:10px}
.poolhint{font-size:11px;color:var(--dim);margin:16px 0 8px;letter-spacing:.02em}
.poolchips{display:flex;flex-wrap:wrap;gap:5px}
.poolchips span{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);

.chips::-webkit-scrollbar{display:none}

  padding:6px 11px;background:transparent;font-weight:600}

.libitem{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n y" "d y" "c y";gap:1px 8px;
  padding:11px 0;border-top:1px solid var(--line);align-items:center}
.libitem:first-of-type{border-top:none;padding-top:4px}
.li-n{grid-area:n;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.li-d{grid-area:d;font-size:11px;color:var(--acc);font-weight:600}
.li-c{grid-area:c;font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px}

.steps{display:grid;gap:9px;margin:12px 0 4px}

.inst-body{display:grid;gap:8px;font-size:12.5px;line-height:1.45}
.is{display:flex;gap:10px;align-items:flex-start;color:var(--dim);line-height:1.45}
.is>span:last-child{flex:1}
.is b{color:var(--ink)}
.n1{width:19px;height:19px;flex:none;border-radius:50%;background:var(--acc);color:#1a0d03;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}

.qr{width:170px;height:170px;border-radius:14px;background:#fff}

.note{font-size:12.5px;color:var(--dim);margin-top:10px}
.ref h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:18px 0 6px}

.ref td:first-child{color:var(--dim);white-space:nowrap;padding-right:12px}
.rest{text-align:center;color:var(--dim);padding:26px 0;font-size:13.5px}
.hide{display:none!important}
@media(min-width:700px){
  body{padding-bottom:24px;display:flex;flex-direction:column}
  header{order:0;position:static;padding-top:18px}
  header{padding-left:max(16px,calc((100% - 840px)/2 + 15px));padding-right:max(16px,calc((100% - 840px)/2 + 15px))}
  nav{order:1;position:sticky;top:0;bottom:auto;justify-content:center;gap:6px;background:var(--bg);
    border-top:none;border-bottom:1px solid var(--line);padding:8px}
  main{order:2;flex:1;width:100%}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:12.5px;padding:8px 14px}
  .ringwrap{width:300px;height:300px}
  .tmid .big{font-size:88px}
}

function dkey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function todayCode(){ return DAGEN[new Date().getDay()] }
function dayLog(ds){ S.log[ds]=S.log[ds]||{}; return S.log[ds] }
function totalOf(code){ return (P[code].ex||[]).reduce((a,e)=>a+e.s,0) }
function doneOn(ds,code){ const L=S.log[ds]||{}; return (P[code].ex||[]).reduce((a,e,i)=>a+Math.min(L[code+"-"+i]||0,e.s),0) }
function doneToday(){ return doneOn(dkey(),todayCode()) }
function pctToday(){ const t=totalOf(todayCode()); return t?Math.round(doneToday()/t*100):0 }
function monday(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x }
function histWeeks(n){
  const out=[], m=monday(new Date());
  for(let i=n-1;i>=0;i--){
    const st=new Date(m); st.setDate(st.getDate()-i*7);
    let tot=0,dn=0;
    for(let j=0;j<7;j++){
      const d=new Date(st); d.setDate(d.getDate()+j);
      const c=DAGEN[d.getDay()];
      tot+=totalOf(c); dn+=doneOn(dkey(d),c);
    }
    out.push({pct: tot?Math.round(dn/tot*100):0, lbl:(st.getDate())+"/"+(st.getMonth()+1), now:i===0});
  }
  return out;
}

      save(); finishSlot();
      render();

function finishSlot(){
  const cur=S.slot[dkey()]; if(!cur) return;
  if(Object.keys(cur.done||{}).length===cur.idx.length){
    S.min[dkey()]=true; save(); toast("Verrassing klaar — dag gered"); beep();
  }
}
function spin(card){
  const reels=[card.querySelector("#r0"),card.querySelector("#r1"),card.querySelector("#r2")];
  const btn=card.querySelector("#spin");
  const out=card.querySelector("#slotout");
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="lever">▮</span> …' }
  if(out) out.innerHTML="";
  reels.forEach(r=>r.classList.add("rolling"));
  const big=Math.random()<0.5, target=big?600:300;
  const pick=[]; let sum=0;
  while(sum<target && pick.length<POOL.length){
    const r=Math.floor(Math.random()*POOL.length);
    if(!pick.includes(r)){ pick.push(r); sum+=POOL[r].s }
  }
  let t=0;
  const iv=setInterval(()=>{
    t+=70;
    reels.forEach((r,i)=>{ if(t < 700+i*220) r.textContent=POOL[Math.floor(Math.random()*POOL.length)].n });
    if(t>1100){
      clearInterval(iv);
      reels.forEach(r=>r.classList.remove("rolling"));
      S.slot[dkey()]={idx:pick,done:{}}; save();
      if(btn){ btn.disabled=false }
      burst(card);
      beep();
      if(navigator.vibrate) navigator.vibrate([40,60,40,60,120]);
      toast(Math.round(sum/60)+" minuten — veel plezier");
      render();
    }
  },70);
}
function burst(host){
  host.classList.add("pop");
  setTimeout(()=>host.classList.remove("pop"),600);
  for(let i=0;i<16;i++){
    const p=document.createElement("i"); p.className="spark";
    const a=Math.random()*Math.PI*2, d=70+Math.random()*80;
    p.style.setProperty("--tx",(Math.cos(a)*d).toFixed(0)+"px");
    p.style.setProperty("--ty",(Math.sin(a)*d).toFixed(0)+"px");
    p.style.background=["#ff8a3d","#3ddc84","#f5c451"][i%3];
    host.append(p);
    setTimeout(()=>p.remove(),900);
  }
}
function startChain(items){
  CHAIN={items,i:0};
  runChain();
}
function runChain(){
  if(!CHAIN) return;
  if(CHAIN.i>=CHAIN.items.length){
    CHAIN=null; stopTimer(); S.min[dkey()]=true; save();
    toast("Circuit klaar"); beep(); render(); return;
  }
  const it=CHAIN.items[CHAIN.i];
  startTimer(it.s, it.n, "blok "+(CHAIN.i+1)+" van "+CHAIN.items.length);
  CHAIN.i++;
}

      html+=`<div class="blk" data-k="${bi}-${ii}"><div class="box ${on?"on":""}">✓</div><div style="flex:1"><div class="t">${it[0]}</div></div>${YT(it[1])}</div>`;
    });
    card.innerHTML=html;
    card.querySelectorAll(".blk").forEach(row=>{
      row.onclick=e=>{ if(e.target.closest("a")) return;
        const k=row.dataset.k; S.blk[d][k]=!S.blk[d][k]; save(); render() };
    });
    f.append(card);
  });
  return f;
}

/* ============ streak & toast ============ */
function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const c=DAGEN[d.getDay()], ds=dkey(d);
    const any = P[c].ex.length ? doneOn(ds,c)>0 : Object.values(S.blk[ds]||{}).some(Boolean);
    if(any || S.min[ds]) n++;
    else if(c!=="zo") break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function toast(msg){
  const t=el("div","toast",msg);
  document.body.append(t);
  setTimeout(()=>t.classList.add("in"),30);
  setTimeout(()=>{ t.classList.remove("in"); setTimeout(()=>t.remove(),400) },2600);
}

/* ============ timer ============ */
let T={left:0,total:0,id:null,label:""};
const RING=2*Math.PI*112;
function startTimer(sec,label,next){
  T.left=sec; T.total=sec; T.label=label||"rust";
  $("#t-lbl").textContent=T.label;
  $("#t-next").textContent=next||"";
  const r=$("#t-ring");
  r.style.strokeDasharray=RING;
  r.style.strokeDashoffset=0;
  $("#timer").classList.add("show");
  tick(true);
  clearInterval(T.id);
  T.id=setInterval(()=>{ T.left--; tick() },1000);
}
function tick(first){
  const b=$("#t-big"), l=Math.max(0,T.left);
  b.textContent=l;
  b.classList.toggle("done",l<=0);
  const p=T.total?Math.min(1,Math.max(0,l/T.total)):0;
  $("#t-ring").style.strokeDashoffset=RING*(1-p);
  if(l<=0 && !first){
    clearInterval(T.id);
    beep();
    if(navigator.vibrate) navigator.vibrate([90,60,90]);
    if(CHAIN) setTimeout(()=>{ if(CHAIN) runChain() },1800);
  }
}
function stopTimer(){ clearInterval(T.id); CHAIN=null; $("#timer").classList.remove("show") }
$("#t-skip").onclick=stopTimer;
$("#t-add").onclick=()=>{ T.left+=15; T.total+=15; tick() };
$("#timer").onclick=e=>{ if(e.target.id==="timer") stopTimer() };
function beep(){
  try{
    const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.55);
    o.start(); o.stop(a.currentTime+.6);
  }catch(e){}
}
